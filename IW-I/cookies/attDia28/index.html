<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localiza Users</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Localiza Users</h1>
        <p id="boasVindas"></p>
    </header>

    <!-- Janela que pergunta sobre os cookies -->
    <div id="autorizacao" style="display: none;">
        <div id="caixaCookies">
            <h2>Cookies</h2>
            <p>
                Este site utiliza cookies para salvar seu nome e suas
                preferências. Você aceita?
            </p>

            <button id="botaoSim">Sim</button>
            <button id="botaoNao">Não</button>
        </div>
    </div>

    <p id="mensagemAcesso"></p>

    <!-- Login: aparece depois que o usuário aceita os cookies -->
    <div id="login" style="display: none;">
        <p>Digite seu nome de usuário temporário (válido por 7 dias).</p>

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
        >

        <button id="entrar">Entrar</button>
    </div>

    <!-- Funcionalidades liberadas após o login -->
    <main id="conteudo" style="display: none;">

        <section>
            <h2>Procurar usuário</h2>
            <input
                type="text"
                id="busca"
                placeholder="Nome ou usuário (ex.: Ervin)"
            >
            <button id="botaoProcurar">Procurar</button>
        </section>

        <section>
            <h2>Ver todos</h2>
            <button id="botaoTodos">Carregar todos os usuários</button>
        </section>

        <section>
            <h2>Como exibir</h2>
            <button id="botaoTexto">Em texto</button>
            <button id="botaoCartoes">Em cartões</button>
        </section>

        <p id="contador">Você já realizou 0 consultas nesta aplicação.</p>

        <button id="limpar">Limpar preferências</button>

        <div id="resultado"></div>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
