<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos favoritos</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <h1>Loja de produtos</h1>

    <!-- Pergunta sobre a autorização dos cookies -->
    <div id="autorizacao">
        <p>Você autoriza o uso de cookies para salvar seus favoritos?</p>

        <button id="aceitar">Aceitar</button>
        <button id="negar">Não aceitar</button>
    </div>

    <h2>Produtos</h2>

    <div id="produtos">

        <p>
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/QWERTY_keyboard.jpg?width=300" alt="Teclado">
            Teclado
            <input type="checkbox" id="produto101" value="101">
        </p>

        <p>
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/A_black_wireless_computer_mouse.jpg?width=300" alt="Mouse">
            Mouse
            <input type="checkbox" id="produto102" value="102">
        </p>

        <p>
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_Headset.jpg?width=300" alt="Headset">
            Headset
            <input type="checkbox" id="produto103" value="103">
        </p>

        <p>
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Computer_monitor.jpg?width=300" alt="Monitor">
            Monitor
            <input type="checkbox" id="produto104" value="104">
        </p>

        <p>
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/USB_webcam_for_PC.jpg?width=300" alt="Webcam">
            Webcam
            <input type="checkbox" id="produto105" value="105">
        </p>

        <p>
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/USB-Microphone.jpg?width=300" alt="Microfone">
            Microfone
            <input type="checkbox" id="produto106" value="106">
        </p>

        <button id="salvar">Salvar favoritos</button>

    </div>

    <h2>Meus favoritos</h2>

    <div id="listaFavoritos"></div>

</body>
</html>
